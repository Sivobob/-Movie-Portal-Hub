name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 typescript@5.9.3 --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Movie-Portal.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Portal-APK
          path: Movie-Portal.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "Movie Portal Latest Android APK"
          body: "Automated Android APK build from latest source with updated launcher icon and features."
          files: Movie-Portal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to repository for direct download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/downloads
          cp Movie-Portal.apk public/downloads/Movie-Portal.apk
          git add public/downloads/Movie-Portal.apk
          git commit -m "chore: automated APK build update [skip ci]" || true
          git push origin main || true


