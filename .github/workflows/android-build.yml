name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Movie-Portal.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Movie-Portal.apk
          ls -lh Movie-Portal.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Portal-APK
          path: Movie-Portal.apk

      - name: Publish Release to GitHub
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Movie-Portal.apk --title "Movie Portal Latest Android APK" --notes "Official Android APK compiled automatically from latest source."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to repository for direct download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Movie-Portal.apk
          git commit -m "chore: automated real APK build update [skip ci]" || true
          git push origin main --force || true
