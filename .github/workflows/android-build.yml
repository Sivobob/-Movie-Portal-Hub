name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          echo "ext { cdvPluginPostBuildExtras = [] }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "Injecting clean 160MB uncompressed asset for 170MB+ APK size..."
          dd if=/dev/zero of=android/app/src/main/assets/core_payload.dat bs=1M count=160

      - name: Restore Persistent Signing Keystore (If Configured)
        run: |
          mkdir -p android/app/keystores ~/.android
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > android/app/keystores/release.jks
            echo "Restored permanent release keystore from GitHub Secrets."
          elif [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Restored persistent debug keystore from GitHub Secrets."
          else
            echo "No persistent keystore secret configured; using Gradle default debug keystore."
          fi

      - name: Build Android APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          echo "Cleaning gradle caches and transforms..."
          rm -rf ~/.gradle/caches/transforms-*
          rm -rf ~/.gradle/caches/journal-*
          rm -rf ~/.gradle/caches/8.2.1/transforms/
          if [ -f "app/keystores/release.jks" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] && [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "Building signed release APK..."
            ./gradlew clean assembleRelease --no-daemon --stacktrace \
              -PRELEASE_STORE_FILE="keystores/release.jks" \
              -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
              -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
              -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
          else
            echo "Building standard APK..."
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Signed Release APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "ERROR: Expected signed release APK not found!"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK with $APKSIGNER..."
            "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          else
            echo "apksigner not found in $ANDROID_HOME/build-tools, skipping apksigner check"
          fi

      - name: Prepare APK Asset
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            # Universal file names so download link always works on latest release
            cp "$APK_PATH" Movie-Portal.apk
            cp "$APK_PATH" Movie-Portal-latest.apk
            cp "$APK_PATH" Movie-Portal-v3.5.${{ github.run_number }}.apk
            echo "Signed release APK assets prepared: Movie-Portal.apk, Movie-Portal-latest.apk, Movie-Portal-v3.5.${{ github.run_number }}.apk"
          else
            echo "Signed release APK NOT FOUND!"
            find android -name "*.apk"
            exit 1
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v3.5.${{ github.run_number }}"
          name: "Movie Portal Android v3.5.${{ github.run_number }}"
          body: |
            Automated Android APK build for Movie Portal.
            Built on push to main branch (Run #${{ github.run_number }}).
            Commit: ${{ github.sha }}
          files: |
            Movie-Portal.apk
            Movie-Portal-latest.apk
            Movie-Portal-v3.5.${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

