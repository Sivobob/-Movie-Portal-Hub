name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          echo "// dummy" > android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build Android APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Movie-Portal.apk
          ls -lh Movie-Portal.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Portal-APK
          path: Movie-Portal.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v2.5.${{ github.run_number }}"
          name: "Movie Portal Android APK v2.5.${{ github.run_number }}"
          body: "Official Android APK compiled automatically from latest source code. If you have an older version installed, please uninstall it first."
          files: Movie-Portal.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
